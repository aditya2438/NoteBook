name: Nexora Notes CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npx tsx --test src/utils/canvasMath.test.ts

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
